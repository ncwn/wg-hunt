packages:
  - packages/*
  - apps/*
  # The CLI's and the dashboard's typed API clients are generated by one dev-only package that
  # sits with the server, which owns the OpenAPI document.
  - apps/server/api-codegen
allowBuilds:
  better-sqlite3: true
  esbuild: true
overrides:
  # drizzle-kit's deprecated loader pins esbuild 0.18 (GHSA-67mh-4wv8-2f99). Dev-only.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
