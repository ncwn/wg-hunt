services:
  wg-hunt:
    image: ghcr.io/ncwn/wg-hunt:${WG_HUNT_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      # Loopback only: the dashboard is never reachable from the rest of the network.
      - "127.0.0.1:8787:8787"
    volumes:
      # The database, stored pages and secrets. Gitignored.
      - ./.data:/app/.data

  # Installs new wg-hunt releases once a day. Only touches containers labelled above.
  watchtower:
    image: nickfedor/watchtower:1
    restart: unless-stopped
    command: --label-enable --cleanup --schedule "0 0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
